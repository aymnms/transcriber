name: Manual Build (test artifacts)

# Temporary workflow: builds Windows and Linux bundles from this branch and
# uploads them as CI artifacts (no tag, no GitHub Release) so J9's fixes can
# be tested on real machines before merging to main. Remove once no longer
# needed — see PLAN.md J9.

on:
  workflow_dispatch:
  push:
    branches: ["fix/windows-hang-and-linux-glibc"]

jobs:
  build-windows:
    name: Build Windows bundle (test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build bundle
        run: |
          python -m pip install --upgrade pip -r requirements.txt
          pyinstaller --windowed --onedir app_whisper.py --name "Transcriber" --icon assets/logo.ico

      - name: Zip bundle
        run: Compress-Archive -Path "dist/Transcriber/*" -DestinationPath "Transcriber-Windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Transcriber-Windows
          path: Transcriber-Windows.zip

  build-linux:
    name: Build Linux bundle (test)
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install prerequisites (bare image has neither git nor Python)
        run: |
          apt-get update
          apt-get install -y git curl ca-certificates python3 python3-venv python3-pip python3-tk

      - uses: actions/checkout@v4

      - name: Build bundle
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/pyinstaller --windowed --onedir app_whisper.py --name "transcriber" --icon assets/logo.png
          tar -C dist -czf transcriber-Linux.tar.gz transcriber

      - name: Assemble AppDir
        run: |
          mkdir -p Transcriber.AppDir/usr/bin
          cp -r dist/transcriber/* Transcriber.AppDir/usr/bin/
          cp packaging/linux/transcriber.desktop Transcriber.AppDir/transcriber.desktop
          cp assets/logo.png Transcriber.AppDir/transcriber.png
          ln -s usr/bin/transcriber Transcriber.AppDir/AppRun

      - name: Build AppImage
        run: |
          curl -fsSL -o appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract
          ./squashfs-root/AppRun Transcriber.AppDir transcriber-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: transcriber-Linux
          path: |
            transcriber-Linux.tar.gz
            transcriber-x86_64.AppImage
