name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Determine next version and publish
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - run: git reset --hard ${{ github.event.workflow_run.head_sha }}

      - name: Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"

  build-macos:
    name: Build macOS bundles (ARM + Intel via Rosetta)
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build ARM bundle
        run: |
          python -m pip install --upgrade pip -r requirements.txt
          pyinstaller --windowed --onedir app_whisper.py --name "Transcriber (ARM)" --icon assets/MyIcon.icns
          ditto -c -k --sequesterRsrc --keepParent "dist/Transcriber (ARM).app" "Transcriber-macOS-ARM.zip"

      - name: Install Rosetta 2
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Build Intel bundle (via Rosetta)
        run: |
          arch -x86_64 python3 -m venv .venv-x86_64
          arch -x86_64 .venv-x86_64/bin/python -m pip install --upgrade pip -r requirements.txt
          arch -x86_64 .venv-x86_64/bin/python -m PyInstaller --windowed --onedir app_whisper.py --name "Transcriber (Intel)" --icon assets/MyIcon.icns
          ditto -c -k --sequesterRsrc --keepParent "dist/Transcriber (Intel).app" "Transcriber-macOS-Intel.zip"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release.outputs.tag }}" Transcriber-macOS-ARM.zip Transcriber-macOS-Intel.zip

  build-windows:
    name: Build Windows bundle
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build bundle
        run: |
          python -m pip install --upgrade pip -r requirements.txt
          pyinstaller --windowed --onedir app_whisper.py --name "Transcriber" --icon assets/logo.ico

      - name: Zip bundle
        run: Compress-Archive -Path "dist/Transcriber/*" -DestinationPath "Transcriber-Windows.zip"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release.outputs.tag }}" Transcriber-Windows.zip

  build-linux:
    name: Build Linux bundle
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tk system dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Build bundle
        run: |
          python -m pip install --upgrade pip -r requirements.txt
          pyinstaller --windowed --onedir app_whisper.py --name "transcriber" --icon assets/logo.png
          tar -C dist -czf transcriber-Linux.tar.gz transcriber

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release.outputs.tag }}" transcriber-Linux.tar.gz
