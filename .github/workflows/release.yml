name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Determine next version and publish
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - run: git reset --hard ${{ github.event.workflow_run.head_sha }}

      - name: Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"

  build-macos:
    name: Build macOS bundles (ARM + Intel via Rosetta)
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build ARM bundle
        run: |
          python -m pip install --upgrade pip -r requirements.txt
          pyinstaller --windowed --onedir app_whisper.py --name "Transcriber (ARM)" --icon assets/MyIcon.icns
          ditto -c -k --sequesterRsrc --keepParent "dist/Transcriber (ARM).app" "Transcriber-macOS-ARM.zip"

      - name: Install Rosetta 2
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Build Intel bundle (via Rosetta)
        run: |
          arch -x86_64 python3 -m venv .venv-x86_64
          arch -x86_64 .venv-x86_64/bin/python -m pip install --upgrade pip -r requirements.txt
          arch -x86_64 .venv-x86_64/bin/python -m PyInstaller --windowed --onedir app_whisper.py --name "Transcriber (Intel)" --icon assets/MyIcon.icns
          ditto -c -k --sequesterRsrc --keepParent "dist/Transcriber (Intel).app" "Transcriber-macOS-Intel.zip"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release.outputs.tag }}" Transcriber-macOS-ARM.zip Transcriber-macOS-Intel.zip

  build-windows:
    name: Build Windows bundle
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build bundle
        run: |
          python -m pip install --upgrade pip -r requirements.txt
          pyinstaller --windowed --onedir app_whisper.py --name "Transcriber" --icon assets/logo.ico

      - name: Zip bundle
        run: Compress-Archive -Path "dist/Transcriber/*" -DestinationPath "Transcriber-Windows.zip"

      - name: Build installer
        run: iscc /DMyAppVersion=${{ needs.release.outputs.version }} packaging\windows\installer.iss

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release.outputs.tag }}" Transcriber-Windows.zip Transcriber-Setup.exe

  build-linux:
    name: Build Linux bundle
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    # Built inside an ubuntu:22.04 container (glibc 2.35) rather than directly
    # on ubuntu-latest (glibc 2.39+): PyInstaller bundles libpython linked
    # against the build machine's glibc, so building on a newer glibc than
    # most users have produces a binary that fails to start for them
    # ("GLIBC_2.38 not found"). A container decouples this from the runner
    # image's own lifecycle (ubuntu-22.04 as a *runner label* is itself
    # being deprecated from 2026-09-17 — see AUDIT.md addenda for J9).
    container: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
    permissions:
      contents: write
    steps:
      - name: Install prerequisites (bare image has neither git nor Python)
        run: |
          apt-get update
          apt-get install -y git curl ca-certificates python3 python3-venv python3-pip python3-tk gh

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Build bundle
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/pyinstaller --windowed --onedir app_whisper.py --name "transcriber" --icon assets/logo.png
          tar -C dist -czf transcriber-Linux.tar.gz transcriber

      - name: Assemble AppDir
        run: |
          mkdir -p Transcriber.AppDir/usr/bin
          cp -r dist/transcriber/* Transcriber.AppDir/usr/bin/
          cp packaging/linux/transcriber.desktop Transcriber.AppDir/transcriber.desktop
          cp assets/logo.png Transcriber.AppDir/transcriber.png
          ln -s usr/bin/transcriber Transcriber.AppDir/AppRun

      - name: Build AppImage
        run: |
          curl -fsSL -o appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract
          ./squashfs-root/AppRun Transcriber.AppDir transcriber-x86_64.AppImage

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release.outputs.tag }}" transcriber-Linux.tar.gz transcriber-x86_64.AppImage
