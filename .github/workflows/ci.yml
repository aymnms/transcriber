name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff==0.16.3

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (Apple Silicon)
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tk system dependency (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest tests/unit tests/functional -v

  e2e:
    name: e2e (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (Apple Silicon)
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tk system dependency (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Run end-to-end transcription smoke test
        run: python -m pytest tests/e2e -v -m e2e

  test-intel-rosetta:
    name: test (macOS Intel via Rosetta)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rosetta 2
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Create an x86_64 virtualenv under Rosetta
        run: arch -x86_64 python3 -m venv .venv-x86_64

      - name: Install dependencies (x86_64 wheels, via Rosetta)
        run: arch -x86_64 .venv-x86_64/bin/python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Confirm the venv actually executes as x86_64
        run: |
          arch -x86_64 .venv-x86_64/bin/python -c "
          import platform
          assert platform.machine() == 'x86_64', platform.machine()
          print('OK: running as', platform.machine())
          "

      - name: Run test suite (x86_64 under Rosetta)
        run: arch -x86_64 .venv-x86_64/bin/python -m pytest tests/unit tests/functional -v

  e2e-intel-rosetta:
    name: e2e (macOS Intel via Rosetta)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rosetta 2
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Create an x86_64 virtualenv under Rosetta
        run: arch -x86_64 python3 -m venv .venv-x86_64

      - name: Install dependencies (x86_64 wheels, via Rosetta)
        run: arch -x86_64 .venv-x86_64/bin/python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Run end-to-end transcription smoke test (x86_64 under Rosetta)
        run: arch -x86_64 .venv-x86_64/bin/python -m pytest tests/e2e -v -m e2e

  linux-glibc-diagnostic:
    name: linux-glibc-diagnostic (build inside ubuntu:22.04 container)
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Install prerequisites (no git/curl/tk in the base image)
        run: |
          apt-get update
          apt-get install -y git curl ca-certificates python3-tk binutils

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build bundle
        run: |
          python -m pip install --upgrade pip -r requirements.txt
          pyinstaller --windowed --onedir app_whisper.py --name "transcriber" --icon assets/logo.png

      - name: Report highest GLIBC symbol version required by the bundled libpython
        run: |
          objdump -T dist/transcriber/_internal/libpython3.11.so.1.0 \
            | grep -oP 'GLIBC_[0-9.]+' | sort -V -u | tail -5
