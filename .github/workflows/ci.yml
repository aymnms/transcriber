name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (Apple Silicon)
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tk system dependency (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest tests/unit tests/functional -v

  e2e:
    name: e2e (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (Apple Silicon)
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tk system dependency (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Run end-to-end transcription smoke test
        run: python -m pytest tests/e2e -v -m e2e

  test-intel-rosetta:
    name: test (macOS Intel via Rosetta)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rosetta 2
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Create an x86_64 virtualenv under Rosetta
        run: arch -x86_64 python3 -m venv .venv-x86_64

      - name: Install dependencies (x86_64 wheels, via Rosetta)
        run: arch -x86_64 .venv-x86_64/bin/python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Confirm the venv actually executes as x86_64
        run: |
          arch -x86_64 .venv-x86_64/bin/python -c "
          import platform
          assert platform.machine() == 'x86_64', platform.machine()
          print('OK: running as', platform.machine())
          "

      - name: Run test suite (x86_64 under Rosetta)
        run: arch -x86_64 .venv-x86_64/bin/python -m pytest tests/unit tests/functional -v

  e2e-intel-rosetta:
    name: e2e (macOS Intel via Rosetta)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rosetta 2
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Create an x86_64 virtualenv under Rosetta
        run: arch -x86_64 python3 -m venv .venv-x86_64

      - name: Install dependencies (x86_64 wheels, via Rosetta)
        run: arch -x86_64 .venv-x86_64/bin/python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Run end-to-end transcription smoke test (x86_64 under Rosetta)
        run: arch -x86_64 .venv-x86_64/bin/python -m pytest tests/e2e -v -m e2e
